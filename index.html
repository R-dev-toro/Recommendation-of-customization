<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iekei Ramen Customizer</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f9f4ef; /* スープをイメージした背景色 */
            color: #333; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }
        .container { 
            max-width: 500px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
        }
        h1 { color: #d32f2f; font-size: 1.5em; margin-bottom: 20px;}
        h2 { font-size: 1.2em; color: #555; margin-bottom: 20px; line-height: 1.4; }
        .question-block { display: none; }
        .question-block.active { display: block; animation: fadeIn 0.4s ease-in; }
        
        .btn { 
            display: block; 
            width: 100%; 
            padding: 16px; 
            margin: 12px 0; 
            background-color: #ff9800; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            transition: background 0.2s; 
            line-height: 1.3;
        }
        .btn:hover { background-color: #e68a00; }
        
        #result-section { display: none; }
        .result-box {
            background: #fff3e0;
            border: 2px solid #ff9800;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        .result-item { 
            font-size: 1.2em; 
            font-weight: bold; 
            margin: 10px 0; 
            color: #d32f2f;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 10px;
        }
        .result-item:last-child { border-bottom: none; }
        .reset-btn { background-color: #757575; margin-top: 25px;}
        .reset-btn:hover { background-color: #616161; }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍜 Iekei Ramen Customizer</h1>
        
        <!-- Q1 -->
        <div id="q1" class="question-block active">
            <h2>Q1. How tired are you today?</h2>
            <button class="btn" onclick="nextQuestion(1, 'Extra', 'salt')">I sweated a lot! I need a salty punch.</button>
            <button class="btn" onclick="nextQuestion(1, 'Normal', 'salt')">Just a normal day. A balanced flavor is fine.</button>
            <button class="btn" onclick="nextQuestion(1, 'Light', 'salt')">I sat at a desk all day / Watch my sodium.</button>
        </div>

        <!-- Q2 -->
        <div id="q2" class="question-block">
            <h2>Q2. How is your stomach feeling?</h2>
            <button class="btn" onclick="nextQuestion(2, 'Extra', 'oil')">Perfect! Bring on the rich chicken oil.</button>
            <button class="btn" onclick="nextQuestion(2, 'Normal', 'oil')">Normal. Standard richness is good.</button>
            <button class="btn" onclick="nextQuestion(2, 'Less', 'oil')">A bit heavy / I prefer a lighter soup.</button>
        </div>

        <!-- Q3 -->
        <div id="q3" class="question-block">
            <h2>Q3. How fast do you usually eat noodles?</h2>
            <button class="btn" onclick="nextQuestion(3, 'Firm', 'noodle')">I eat fast! / I love a chewy texture.</button>
            <button class="btn" onclick="nextQuestion(3, 'Normal', 'noodle')">Average pace / No strong preference.</button>
            <button class="btn" onclick="nextQuestion(3, 'Soft', 'noodle')">I take my time / I like soft noodles.</button>
        </div>

        <!-- Q4 -->
        <div id="q4" class="question-block">
            <h2>Q4. How does "wrapping rice with soup-soaked seaweed" sound?</h2>
            <button class="btn" onclick="showResult('Yes, please!')">Sounds amazing! I'm starving.</button>
            <button class="btn" onclick="showResult('No thanks')">Just ramen is enough for me.</button>
        </div>

        <!-- 結果画面 -->
        <div id="result-section" class="question-block">
            <h2>Here is your perfect order! <br>(Show this to the staff)</h2>
            <div class="result-box">
                <div class="result-item">Noodle (麺): <span id="res-noodle"></span></div>
                <div class="result-item">Saltiness (味): <span id="res-salt"></span></div>
                <div class="result-item">Oil (油): <span id="res-oil"></span></div>
                <div class="result-item">Rice (ライス): <span id="res-rice"></span></div>
            </div>
            <button class="btn reset-btn" onclick="location.reload()">Start Over</button>
        </div>
    </div>

    <script>
        // 回答を保存する変数
        const order = { salt: '', oil: '', noodle: '', rice: '' };

        // 次の質問へ進む関数
        function nextQuestion(currentQ, answer, type) {
            order[type] = answer;
            document.getElementById('q' + currentQ).classList.remove('active');
            document.getElementById('q' + (currentQ + 1)).classList.add('active');
        }

        // 結果を表示する関数
        function showResult(riceAnswer) {
            order.rice = riceAnswer;
            
            document.getElementById('q4').classList.remove('active');
            
            document.getElementById('res-salt').innerText = order.salt;
            document.getElementById('res-oil').innerText = order.oil;
            document.getElementById('res-noodle').innerText = order.noodle;
            document.getElementById('res-rice').innerText = order.rice;
            
            document.getElementById('result-section').classList.add('active');
        }
    </script>
</body>
</html>
