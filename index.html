<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iekei Ramen Customizer</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            /* 背景画像と、画像を暗くする黒の半透明フィルターを設定 */
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('IMG_5789.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* スクロールしても背景を固定 */
            color: #333; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container { 
            width: 100%;
            max-width: 500px; 
            /* 質問の枠を少しだけ透過させた白に変更して馴染ませる */
            background: rgba(255, 255, 255, 0.92); 
            padding: 30px 20px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            text-align: center;
        }
        h1 { color: #d32f2f; font-size: 1.5em; margin-top: 0; margin-bottom: 25px;}
        h2 { font-size: 1.2em; color: #444; margin-bottom: 20px; line-height: 1.4; }
        
        .question-block { display: none; }
        .question-block.active { display: block; animation: fadeIn 0.4s ease-in-out; }
        
        .btn { 
            display: block; 
            width: 100%; 
            padding: 16px; 
            margin: 12px 0; 
            background-color: #ff9800; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            transition: all 0.2s; 
            line-height: 1.3;
        }
        .btn:hover { background-color: #e68a00; transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        
        .result-box {
            background: #fff3e0;
            border: 2px solid #ff9800;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
        }
        .result-item { 
            font-size: 1.1em; 
            font-weight: bold; 
            margin: 12px 0; 
            color: #d32f2f;
            border-bottom: 1px dashed #ffcc80;
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }
        .result-item span { color: #333; }
        .result-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0;}
        
        .reset-btn { background-color: #757575; margin-top: 30px;}
        .reset-btn:hover { background-color: #616161; }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍜 Iekei Ramen Customizer</h1>
        
        <!-- Q1 -->
        <div id="q1" class="question-block active">
            <h2>Q1. How tired are you today?</h2>
            <button class="btn" onclick="nextQuestion(1, 'Extra (こいめ)', 'salt')">I sweated a lot! I need a salty punch.</button>
            <button class="btn" onclick="nextQuestion(1, 'Normal (ふつう)', 'salt')">Just a normal day. A balanced flavor is fine.</button>
            <button class="btn" onclick="nextQuestion(1, 'Light (うすめ)', 'salt')">I sat at a desk all day / Watch my sodium.</button>
        </div>

        <!-- Q2 -->
        <div id="q2" class="question-block">
            <h2>Q2. How is your stomach feeling?</h2>
            <button class="btn" onclick="nextQuestion(2, 'Extra (おおめ)', 'oil')">Perfect! Bring on the rich chicken oil.</button>
            <button class="btn" onclick="nextQuestion(2, 'Normal (ふつう)', 'oil')">Normal. Standard richness is good.</button>
            <button class="btn" onclick="nextQuestion(2, 'Less (すくなめ)', 'oil')">A bit heavy / I prefer a lighter soup.</button>
        </div>

        <!-- Q3 -->
        <div id="q3" class="question-block">
            <h2>Q3. How fast do you usually eat noodles?</h2>
            <button class="btn" onclick="nextQuestion(3, 'Firm (かため)', 'noodle')">I eat fast! / I love a chewy texture.</button>
            <button class="btn" onclick="nextQuestion(3, 'Normal (ふつう)', 'noodle')">Average pace / No strong preference.</button>
            <button class="btn" onclick="nextQuestion(3, 'Soft (やわらかめ)', 'noodle')">I take my time / I like soft noodles.</button>
        </div>

        <!-- Q4 -->
        <div id="q4" class="question-block">
            <h2>Q4. How does "wrapping rice with soup-soaked seaweed" sound?</h2>
            <button class="btn" onclick="showResult('Yes, please! (あり)')">Sounds amazing! I'm starving.</button>
            <button class="btn" onclick="showResult('No thanks (なし)')">Just ramen is enough for me.</button>
        </div>

        <!-- 結果画面 -->
        <div id="result-section" class="question-block">
            <h2>Here is your perfect order! <br><span style="font-size: 0.8em; color: #777;">(Show this to the staff)</span></h2>
            <div class="result-box">
                <div class="result-item">Noodles (麺): <span id="res-noodle"></span></div>
                <div class="result-item">Saltiness (味): <span id="res-salt"></span></div>
                <div class="result-item">Oil (油): <span id="res-oil"></span></div>
                <div class="result-item">Rice (ライス): <span id="res-rice"></span></div>
            </div>
            <button class="btn reset-btn" onclick="location.reload()">Start Over</button>
        </div>
    </div>

    <script>
        // 回答を保存するデータ
        const orderData = { salt: '', oil: '', noodle: '', rice: '' };

        // 次の質問へ進む処理
        function nextQuestion(currentStep, answer, type) {
            orderData[type] = answer; // 回答を記録
            
            // 現在の質問を隠す
            const currentBlock = document.getElementById('q' + currentStep);
            if (currentBlock) {
                currentBlock.classList.remove('active');
            }
            
            // 次の質問を表示する
            const nextBlock = document.getElementById('q' + (currentStep + 1));
            if (nextBlock) {
                nextBlock.classList.add('active');
            }
        }

        // 最終結果を表示する処理
        function showResult(riceAnswer) {
            orderData.rice = riceAnswer; // 最後の回答を記録
            
            // Q4を隠す
            const q4Block = document.getElementById('q4');
            if (q4Block) {
                q4Block.classList.remove('active');
            }
            
            // 結果をHTMLに挿入する
            document.getElementById('res-noodle').innerText = orderData.noodle;
            document.getElementById('res-salt').innerText = orderData.salt;
            document.getElementById('res-oil').innerText = orderData.oil;
            document.getElementById('res-rice').innerText = orderData.rice;
            
            // 結果画面を表示する
            const resultBlock = document.getElementById('result-section');
            if (resultBlock) {
                resultBlock.classList.add('active');
            }
        }
    </script>
</body>
</html>
